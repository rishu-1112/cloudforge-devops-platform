services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE:-cloudforge-backend:local}
    build: ./app/backend
    environment:
      MONGO_URI: mongodb://mongo:27017/cloudforge
      DEMO_HEALTH_URL: http://demo:80/health
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12

  frontend:
    image: ${FRONTEND_IMAGE:-cloudforge-frontend:local}
    build: ./app/frontend
    ports:
      - "${CLOUDFORGE_BIND:-127.0.0.1}:${CLOUDFORGE_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

  demo:
    image: nginx:alpine
    volumes:
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo-data:
